[workspace]
resolver = "2"
members = [
  "crates/core",
  "crates/main",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.95"
authors = ["ARGVUS"]
repository = "https://github.com/argvus/argvus-app-profiles"
homepage = "https://github.com/argvus/argvus-app-profiles"
description = "Application profiles and launcher wrappers for the ARGVUS desktop"

[workspace.dependencies]
argvus-tui-terminal-core = { version = "0.1.0", path = "crates/core" }

[profile.release]
lto = true
strip = true
