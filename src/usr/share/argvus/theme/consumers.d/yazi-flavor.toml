# Theme consumer: rendered into every theme build as yazi/flavor.toml.
id = "yazi-flavor"
template = "app-profiles/theme-template/yazi-flavor.toml"
output = "yazi/flavor.toml"

# Defaults for the tokens the template reads; a theme that defines one wins.
[palette]
danger = "#E06C75"
yazi_active_bg = "@bg | mix(@fg, 0.2)"
yazi_border_fg = "@bg | mix(@fg, 0.2)"
yazi_border_fg_2 = "@bg | mix(@fg, 0.2)"
yazi_border_style_fg = "@bg | mix(@fg, 0.1)"
yazi_btn_no_bg = "@bg | mix(@fg, 0.1)"
yazi_btn_no_fg = "@fg | mix(@bg, 0.3)"
yazi_btn_yes_bg = "@bg | mix(@fg, 0.2)"
yazi_btn_yes_fg = "@fg"
yazi_current_bg = "@bg | mix(@fg, 0.1)"
yazi_cwd_fg = "@fg"
yazi_desc_fg = "@fg | mix(@bg, 0.4)"
yazi_find_keyword_fg = "@accent"
yazi_inactive_bg = "@bg | mix(@fg, 0.1)"
yazi_inactive_fg = "@fg | mix(@bg, 0.3)"
yazi_marker_copied_bg = "@accent"
yazi_marker_copied_fg = "@accent"
yazi_marker_cut_bg = "@danger"
yazi_marker_cut_fg = "@danger"
yazi_marker_marked_bg = "@bg | mix(@fg, 0.1)"
yazi_marker_marked_fg = "@bg | mix(@fg, 0.1)"
yazi_marker_selected_fg = "@accent"
yazi_mask_bg = "@bg | mix(@danger, 0.1)"
yazi_mime_fg = "@fg | mix(@bg, 0.4)"
yazi_normal_alt_bg = "@bg | mix(@fg, 0.1)"
yazi_normal_main_bg = "@bg | mix(@fg, 0.2)"
yazi_overall_bg = "@bg"
yazi_perm_read_fg = "@fg | mix(@bg, 0.2)"
yazi_progress_label_fg = "@bg"
yazi_progress_normal_bg = "@bg | mix(@fg, 0.1)"
yazi_select_alt_bg = "@bg"
yazi_select_main_fg = "@bg"
yazi_selected_bg = "@bg | mix(@danger, 0.1)"
yazi_tbl_cell_bg = "@bg | mix(@fg, 0.1)"
yazi_title_fg = "@fg | mix(@bg, 0.4)"
yazi_title_fg_2 = "@fg | mix(@bg, 0.4)"
yazi_title_warn_fg = "@danger | mix(@fg, 0.2)"
yazi_url_fg = "@accent"
yazi_url_fg_2 = "@fg"
yazi_url_fg_3 = "@danger"
