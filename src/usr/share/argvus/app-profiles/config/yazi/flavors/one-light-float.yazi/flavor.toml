# Argvus palette
# ---
# bg         "#FFFFFF"
# bg-2       "#F4F4F5"
# ui         "#FAFAFA"
# ui-2       "#D8DEE4"
# ui-3       "#D7DAE0"
# tx-3       "#6E7781"
# tx-2       "#696C77"
# tx         "#383A42"
# red-400     "#CF222E" re
# orange-400  "#9A6700" or
# yellow-400  "#696C77" ye
# yellow-600  "#9A6700" ye-2
# green-400   "#383A42" gr
# cyan-400    "#383A42" cy
# cyan-600    "#D7DAE0" cy-2
# cyan-700    "#D7DAE0" cy-700
# cyan-900    "#FAFAFA" cy-900
# blue-400    "#383A42" bl
# purple-400  "#696C77" pu
# magenta-400 "#CF222E" ma

[app]
overall = { bg = "#FFFFFF" } # bg

[mgr]
cwd = { fg = "#383A42", bold = true } # tx

# Find
find_keyword = { fg = "#383A42", reversed = true } # cy
find_position = { fg = "#383A42", bold = true, italic = true } # cy

# Marker
marker_copied = { fg = "#383A42", bg = "#383A42" } # gr, gr
marker_cut = { fg = "#CF222E", bg = "#CF222E" } # re, re
marker_marked = { fg = "#D7DAE0", bg = "#D7DAE0" } # cy-700, cy-700
marker_selected = { fg = "#383A42", bg = "#383A42" } # cy, cy

# Count
count_copied = { fg = "#383A42", bold = true, reversed = true } # gr
count_cut = { fg = "#CF222E", bold = true, reversed = true } # re
count_selected = { fg = "#383A42", bold = true, reversed = true } # cy

# Border
border_symbol = "│"
border_style = { fg = "#FAFAFA" } # ui

[indicator]
parent = { underline = true }
current = { fg = "#383A42", bg = "#FAFAFA" } # tx, ui
preview = { underline = true }
padding = { open = "█", close = "█" }

[tabs]
active = { fg = "#383A42", bg = "#D7DAE0", bold = true } # tx, ui-3
inactive = { fg = "#696C77", bg = "#FAFAFA" } # tx-2, ui
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
# Normal mode
normal_main = { fg = "#383A42", bg = "#D7DAE0", bold = true } # tx, ui-3
normal_alt = { fg = "#696C77", bg = "#FAFAFA" } # tx-2, ui

# Select mode
select_main = { fg = "#FFFFFF", bg = "#383A42", bold = true } # bg, cy
select_alt = { fg = "#383A42", bg = "#FAFAFA" } # cy, cy-900

# Unset mode
unset_main = { fg = "#FFFFFF", bg = "#383A42", bold = true } # bg, cy
unset_alt = { fg = "#383A42", bg = "#FAFAFA" } # cy, cy-900

[status]
overall = { fg = "#383A42" } # tx

# Permissions
perm_type = { fg = "#383A42" } # bl
perm_read = { fg = "#696C77" } # ye
perm_write = { fg = "#CF222E" } # re
perm_exec = { fg = "#383A42" } # gr
perm_sep = { fg = "#696C77" } # tx-2

# Progress
progress_label = { fg = "#FFFFFF" } # bg
progress_normal = { fg = "#383A42", bg = "#D7DAE0" } # cy, cy-700
progress_error = { bg = "#CF222E" } # re

[which]
cols = 3
mask = { bg = "#F4F4F5" } # bg-2
cand = { fg = "#383A42", bold = true } # cy
rest = { fg = "#383A42", italic = true } # cy
desc = { fg = "#6E7781" } # tx-3
separator = " "
separator_style = { }

[confirm]
border = { fg = "#D7DAE0" } # ui-3
title = { fg = "#6E7781", bold = true } # tx-3
body = { fg = "#383A42", bold = true } # tx
list = { fg = "#383A42" } # tx
btn_yes = { fg = "#383A42", bg = "#D7DAE0", bold = true } # tx, ui-3
btn_no = { fg = "#696C77", bg = "#FAFAFA" } # tx-2, ui

[spot]
border = { fg = "#D7DAE0" } # ui-3
title = { fg = "#6E7781", bold = true } # tx-3
tbl_col = { fg = "#696C77" } # tx-2
tbl_cell = { fg = "#383A42", bg = "#FAFAFA" } # tx, ui

[notify]
# Notification title
title_info = { fg = "#383A42" } # bl
title_warn = { fg = "#9A6700" } # or
title_error = { fg = "#CF222E" } # re

[pick]
border = { fg = "#D7DAE0", bold = true } # ui-3
active = { fg = "#383A42" } # tx
inactive = { fg = "#696C77" } # tx-2

[input]
border = { fg = "#D7DAE0" } # ui-3
title = { fg = "#6E7781", bold = true } # tx-3
value = { fg = "#383A42" } # tx
selected = { bg = "#F4F4F5" } # bg-2

[cmp]
border = { fg = "#D7DAE0", bold = true } # ui-3
active = { fg = "#383A42", bg = "#FAFAFA" } # tx, ui
inactive = { fg = "#696C77" } # tx-2

[tasks]
border = { fg = "#D7DAE0" } # ui-3
title = { fg = "#6E7781", bold = true } # tx-3
hovered = { fg = "#383A42", bg = "#FAFAFA" } # tx, ui

[help]
on = { fg = "#383A42" } # bl
run = { fg = "#383A42" } # cy
desc = { fg = "#6E7781", italic = true } # tx-3
hovered = { bg = "#FAFAFA" } # ui
footer = { fg = "#FFFFFF", bg = "#383A42", bold = true } # bg, cy

[filetype]
rules = [
  # Empty files
  { mime = "inode/empty", fg = "#6E7781" }, # tx-3

  # Special files
  { url = "*", is = "orphan", fg = "#6E7781" }, # tx-3
  { url = "*/", is = "orphan", fg = "#6E7781" }, # tx-3
  { url = "*", is = "link", fg = "#383A42" }, # cy
  { url = "*/", is = "link", fg = "#383A42" }, # cy
  { url = "*", is = "block", fg = "#383A42" }, # tx
  { url = "*", is = "char", fg = "#383A42" }, # tx
  { url = "*", is = "fifo", fg = "#CF222E" }, # ma
  { url = "*", is = "sock", fg = "#CF222E" }, # ma
  { url = "*", is = "sticky", fg = "#383A42" }, # tx
  { url = "*", is = "dummy", fg = "#6E7781" }, # tx-3

  # Fallback
  { url = "*/", fg = "#383A42" }, # tx
  { url = "*", is = "exec", fg = "#383A42" }, # gr
  { url = "*", fg = "#696C77" } # tx-2
]

[icon]
dirs = [
  { name = ".config", text = "", fg = "#383A42" }, # cy
  { name = ".git", text = "", fg = "#383A42" }, # cy
  { name = ".github", text = "", fg = "#383A42" }, # cy
  { name = ".npm", text = "", fg = "#383A42" }, # cy
  { name = "Desktop", text = "", fg = "#383A42" }, # cy
  { name = "Development", text = "", fg = "#383A42" }, # cy
  { name = "Documents", text = "", fg = "#383A42" }, # cy
  { name = "Downloads", text = "", fg = "#383A42" }, # cy
  { name = "Library", text = "", fg = "#383A42" }, # cy
  { name = "Movies", text = "", fg = "#383A42" }, # cy
  { name = "Music", text = "", fg = "#383A42" }, # cy
  { name = "Pictures", text = "", fg = "#383A42" }, # cy
  { name = "Public", text = "", fg = "#383A42" }, # cy
  { name = "Videos", text = "", fg = "#383A42" } # cy
]
conds = [
  # Special files
  { if = "orphan", text = "", fg = "#6E7781" }, # tx-3
  { if = "link", text = "", fg = "#383A42" }, # cy
  { if = "block", text = "", fg = "#383A42" }, # tx
  { if = "char", text = "", fg = "#383A42" }, # tx
  { if = "fifo", text = "", fg = "#CF222E" }, # ma
  { if = "sock", text = "", fg = "#CF222E" }, # ma
  { if = "sticky", text = "", fg = "#383A42" }, # tx
  { if = "dummy", text = "", fg = "#6E7781" }, # tx-3

  # Fallback
  { if = "dir", text = "", fg = "#383A42" }, # cy
  { if = "exec", text = "", fg = "#383A42" }, # gr
  { if = "!dir", text = "", fg = "#696C77" } # tx-2
