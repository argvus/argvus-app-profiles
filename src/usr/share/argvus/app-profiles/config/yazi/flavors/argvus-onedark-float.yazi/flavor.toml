# Argvus palette
# ---
# bg         "#282C34"
# bg-2       "#1D1D23"
# ui         "#2C313A"
# ui-2       "#3E4451"
# ui-3       "#404552"
# tx-3       "#718994"
# tx-2       "#828997"
# tx         "#ABB2BF"
# red-400     "#4C3A3B" re
# orange-400  "#695B57" or
# yellow-400  "#828997" ye
# yellow-600  "#695B57" ye-2
# green-400   "#61AFEF" gr
# cyan-400    "#61AFEF" cy
# cyan-600    "#172D3D" cy-2
# cyan-700    "#172D3D" cy-700
# cyan-900    "#101C28" cy-900
# blue-400    "#61AFEF" bl
# purple-400  "#5C6370" pu
# magenta-400 "#4C3A3B" ma

[app]
overall = { bg = "#282C34" } # bg

[mgr]
cwd = { fg = "#ABB2BF", bold = true } # tx

# Find
find_keyword = { fg = "#61AFEF", reversed = true } # cy
find_position = { fg = "#61AFEF", bold = true, italic = true } # cy

# Marker
marker_copied = { fg = "#61AFEF", bg = "#61AFEF" } # gr, gr
marker_cut = { fg = "#4C3A3B", bg = "#4C3A3B" } # re, re
marker_marked = { fg = "#172D3D", bg = "#172D3D" } # cy-700, cy-700
marker_selected = { fg = "#61AFEF", bg = "#61AFEF" } # cy, cy

# Count
count_copied = { fg = "#61AFEF", bold = true, reversed = true } # gr
count_cut = { fg = "#4C3A3B", bold = true, reversed = true } # re
count_selected = { fg = "#61AFEF", bold = true, reversed = true } # cy

# Border
border_symbol = "│"
border_style = { fg = "#2C313A" } # ui

[indicator]
parent = { underline = true }
current = { fg = "#ABB2BF", bg = "#2C313A" } # tx, ui
preview = { underline = true }
padding = { open = "█", close = "█" }

[tabs]
active = { fg = "#ABB2BF", bg = "#404552", bold = true } # tx, ui-3
inactive = { fg = "#828997", bg = "#2C313A" } # tx-2, ui
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
# Normal mode
normal_main = { fg = "#ABB2BF", bg = "#404552", bold = true } # tx, ui-3
normal_alt = { fg = "#828997", bg = "#2C313A" } # tx-2, ui

# Select mode
select_main = { fg = "#282C34", bg = "#61AFEF", bold = true } # bg, cy
select_alt = { fg = "#61AFEF", bg = "#101C28" } # cy, cy-900

# Unset mode
unset_main = { fg = "#282C34", bg = "#61AFEF", bold = true } # bg, cy
unset_alt = { fg = "#61AFEF", bg = "#101C28" } # cy, cy-900

[status]
overall = { fg = "#ABB2BF" } # tx

# Permissions
perm_type = { fg = "#61AFEF" } # bl
perm_read = { fg = "#828997" } # ye
perm_write = { fg = "#4C3A3B" } # re
perm_exec = { fg = "#61AFEF" } # gr
perm_sep = { fg = "#828997" } # tx-2

# Progress
progress_label = { fg = "#282C34" } # bg
progress_normal = { fg = "#61AFEF", bg = "#172D3D" } # cy, cy-700
progress_error = { bg = "#4C3A3B" } # re

[which]
cols = 3
mask = { bg = "#1D1D23" } # bg-2
cand = { fg = "#61AFEF", bold = true } # cy
rest = { fg = "#61AFEF", italic = true } # cy
desc = { fg = "#718994" } # tx-3
separator = " "
separator_style = { }

[confirm]
border = { fg = "#404552" } # ui-3
title = { fg = "#718994", bold = true } # tx-3
body = { fg = "#ABB2BF", bold = true } # tx
list = { fg = "#ABB2BF" } # tx
btn_yes = { fg = "#ABB2BF", bg = "#404552", bold = true } # tx, ui-3
btn_no = { fg = "#828997", bg = "#2C313A" } # tx-2, ui

[spot]
border = { fg = "#404552" } # ui-3
title = { fg = "#718994", bold = true } # tx-3
tbl_col = { fg = "#828997" } # tx-2
tbl_cell = { fg = "#ABB2BF", bg = "#2C313A" } # tx, ui

[notify]
# Notification title
title_info = { fg = "#61AFEF" } # bl
title_warn = { fg = "#695B57" } # or
title_error = { fg = "#4C3A3B" } # re

[pick]
border = { fg = "#404552", bold = true } # ui-3
active = { fg = "#ABB2BF" } # tx
inactive = { fg = "#828997" } # tx-2

[input]
border = { fg = "#404552" } # ui-3
title = { fg = "#718994", bold = true } # tx-3
value = { fg = "#ABB2BF" } # tx
selected = { bg = "#1D1D23" } # bg-2

[cmp]
border = { fg = "#404552", bold = true } # ui-3
active = { fg = "#ABB2BF", bg = "#2C313A" } # tx, ui
inactive = { fg = "#828997" } # tx-2

[tasks]
border = { fg = "#404552" } # ui-3
title = { fg = "#718994", bold = true } # tx-3
hovered = { fg = "#ABB2BF", bg = "#2C313A" } # tx, ui

[help]
on = { fg = "#61AFEF" } # bl
run = { fg = "#61AFEF" } # cy
desc = { fg = "#718994", italic = true } # tx-3
hovered = { bg = "#2C313A" } # ui
footer = { fg = "#282C34", bg = "#61AFEF", bold = true } # bg, cy

[filetype]
rules = [
  # Empty files
  { mime = "inode/empty", fg = "#718994" }, # tx-3

  # Special files
  { url = "*", is = "orphan", fg = "#718994" }, # tx-3
  { url = "*/", is = "orphan", fg = "#718994" }, # tx-3
  { url = "*", is = "link", fg = "#61AFEF" }, # cy
  { url = "*/", is = "link", fg = "#61AFEF" }, # cy
  { url = "*", is = "block", fg = "#ABB2BF" }, # tx
  { url = "*", is = "char", fg = "#ABB2BF" }, # tx
  { url = "*", is = "fifo", fg = "#4C3A3B" }, # ma
  { url = "*", is = "sock", fg = "#4C3A3B" }, # ma
  { url = "*", is = "sticky", fg = "#ABB2BF" }, # tx
  { url = "*", is = "dummy", fg = "#718994" }, # tx-3

  # Fallback
  { url = "*/", fg = "#ABB2BF" }, # tx
  { url = "*", is = "exec", fg = "#61AFEF" }, # gr
  { url = "*", fg = "#828997" } # tx-2
]

[icon]
dirs = [
  { name = ".config", text = "", fg = "#61AFEF" }, # cy
  { name = ".git", text = "", fg = "#61AFEF" }, # cy
  { name = ".github", text = "", fg = "#61AFEF" }, # cy
  { name = ".npm", text = "", fg = "#61AFEF" }, # cy
  { name = "Desktop", text = "", fg = "#61AFEF" }, # cy
  { name = "Development", text = "", fg = "#61AFEF" }, # cy
  { name = "Documents", text = "", fg = "#61AFEF" }, # cy
  { name = "Downloads", text = "", fg = "#61AFEF" }, # cy
  { name = "Library", text = "", fg = "#61AFEF" }, # cy
  { name = "Movies", text = "", fg = "#61AFEF" }, # cy
  { name = "Music", text = "", fg = "#61AFEF" }, # cy
  { name = "Pictures", text = "", fg = "#61AFEF" }, # cy
  { name = "Public", text = "", fg = "#61AFEF" }, # cy
  { name = "Videos", text = "", fg = "#61AFEF" } # cy
]
conds = [
  # Special files
  { if = "orphan", text = "", fg = "#718994" }, # tx-3
  { if = "link", text = "", fg = "#61AFEF" }, # cy
  { if = "block", text = "", fg = "#ABB2BF" }, # tx
  { if = "char", text = "", fg = "#ABB2BF" }, # tx
  { if = "fifo", text = "", fg = "#4C3A3B" }, # ma
  { if = "sock", text = "", fg = "#4C3A3B" }, # ma
  { if = "sticky", text = "", fg = "#ABB2BF" }, # tx
  { if = "dummy", text = "", fg = "#718994" }, # tx-3

  # Fallback
  { if = "dir", text = "", fg = "#61AFEF" }, # cy
  { if = "exec", text = "", fg = "#61AFEF" }, # gr
  { if = "!dir", text = "", fg = "#828997" } # tx-2
]