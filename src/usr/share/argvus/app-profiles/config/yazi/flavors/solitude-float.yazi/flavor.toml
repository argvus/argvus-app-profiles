# Argvus palette
# ---
# bg         "#101315"
# bg-2       "#202528"
# ui         "#1A1E20"
# ui-2       "#343D41"
# ui-3       "#343D41"
# tx-3       "#798186"
# tx-2       "#9FA5A9"
# tx         "#CACCCC"
# red-400     "#DE6145" re
# orange-400  "#C9C2B4" or
# yellow-400  "#9FA5A9" ye
# yellow-600  "#C9C2B4" ye-2
# green-400   "#798186" gr
# cyan-400    "#798186" cy
# cyan-600    "#172D3D" cy-2
# cyan-700    "#172D3D" cy-700
# cyan-900    "#101C28" cy-900
# blue-400    "#798186" bl
# purple-400  "#A5AEB4" pu
# magenta-400 "#DE6145" ma

[app]
overall = { bg = "#101315" } # bg

[mgr]
cwd = { fg = "#CACCCC", bold = true } # tx

# Find
find_keyword = { fg = "#798186", reversed = true } # cy
find_position = { fg = "#798186", bold = true, italic = true } # cy

# Marker
marker_copied = { fg = "#798186", bg = "#798186" } # gr, gr
marker_cut = { fg = "#DE6145", bg = "#DE6145" } # re, re
marker_marked = { fg = "#172D3D", bg = "#172D3D" } # cy-700, cy-700
marker_selected = { fg = "#798186", bg = "#798186" } # cy, cy

# Count
count_copied = { fg = "#798186", bold = true, reversed = true } # gr
count_cut = { fg = "#DE6145", bold = true, reversed = true } # re
count_selected = { fg = "#798186", bold = true, reversed = true } # cy

# Border
border_symbol = "│"
border_style = { fg = "#1A1E20" } # ui

[indicator]
parent = { underline = true }
current = { fg = "#CACCCC", bg = "#1A1E20" } # tx, ui
preview = { underline = true }
padding = { open = "█", close = "█" }

[tabs]
active = { fg = "#CACCCC", bg = "#343D41", bold = true } # tx, ui-3
inactive = { fg = "#9FA5A9", bg = "#1A1E20" } # tx-2, ui
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
# Normal mode
normal_main = { fg = "#CACCCC", bg = "#343D41", bold = true } # tx, ui-3
normal_alt = { fg = "#9FA5A9", bg = "#1A1E20" } # tx-2, ui

# Select mode
select_main = { fg = "#101315", bg = "#798186", bold = true } # bg, cy
select_alt = { fg = "#798186", bg = "#101C28" } # cy, cy-900

# Unset mode
unset_main = { fg = "#101315", bg = "#798186", bold = true } # bg, cy
unset_alt = { fg = "#798186", bg = "#101C28" } # cy, cy-900

[status]
overall = { fg = "#CACCCC" } # tx

# Permissions
perm_type = { fg = "#798186" } # bl
perm_read = { fg = "#9FA5A9" } # ye
perm_write = { fg = "#DE6145" } # re
perm_exec = { fg = "#798186" } # gr
perm_sep = { fg = "#9FA5A9" } # tx-2

# Progress
progress_label = { fg = "#101315" } # bg
progress_normal = { fg = "#798186", bg = "#172D3D" } # cy, cy-700
progress_error = { bg = "#DE6145" } # re

[which]
cols = 3
mask = { bg = "#202528" } # bg-2
cand = { fg = "#798186", bold = true } # cy
rest = { fg = "#798186", italic = true } # cy
desc = { fg = "#798186" } # tx-3
separator = " "
separator_style = { }

[confirm]
border = { fg = "#343D41" } # ui-3
title = { fg = "#798186", bold = true } # tx-3
body = { fg = "#CACCCC", bold = true } # tx
list = { fg = "#CACCCC" } # tx
btn_yes = { fg = "#CACCCC", bg = "#343D41", bold = true } # tx, ui-3
btn_no = { fg = "#9FA5A9", bg = "#1A1E20" } # tx-2, ui

[spot]
border = { fg = "#343D41" } # ui-3
title = { fg = "#798186", bold = true } # tx-3
tbl_col = { fg = "#9FA5A9" } # tx-2
tbl_cell = { fg = "#CACCCC", bg = "#1A1E20" } # tx, ui

[notify]
# Notification title
title_info = { fg = "#798186" } # bl
title_warn = { fg = "#C9C2B4" } # or
title_error = { fg = "#DE6145" } # re

[pick]
border = { fg = "#343D41", bold = true } # ui-3
active = { fg = "#CACCCC" } # tx
inactive = { fg = "#9FA5A9" } # tx-2

[input]
border = { fg = "#343D41" } # ui-3
title = { fg = "#798186", bold = true } # tx-3
value = { fg = "#CACCCC" } # tx
selected = { bg = "#202528" } # bg-2

[cmp]
border = { fg = "#343D41", bold = true } # ui-3
active = { fg = "#CACCCC", bg = "#1A1E20" } # tx, ui
inactive = { fg = "#9FA5A9" } # tx-2

[tasks]
border = { fg = "#343D41" } # ui-3
title = { fg = "#798186", bold = true } # tx-3
hovered = { fg = "#CACCCC", bg = "#1A1E20" } # tx, ui

[help]
on = { fg = "#798186" } # bl
run = { fg = "#798186" } # cy
desc = { fg = "#798186", italic = true } # tx-3
hovered = { bg = "#1A1E20" } # ui
footer = { fg = "#101315", bg = "#798186", bold = true } # bg, cy

[filetype]
rules = [
  # Empty files
  { mime = "inode/empty", fg = "#798186" }, # tx-3

  # Special files
  { url = "*", is = "orphan", fg = "#798186" }, # tx-3
  { url = "*/", is = "orphan", fg = "#798186" }, # tx-3
  { url = "*", is = "link", fg = "#798186" }, # cy
  { url = "*/", is = "link", fg = "#798186" }, # cy
  { url = "*", is = "block", fg = "#CACCCC" }, # tx
  { url = "*", is = "char", fg = "#CACCCC" }, # tx
  { url = "*", is = "fifo", fg = "#DE6145" }, # ma
  { url = "*", is = "sock", fg = "#DE6145" }, # ma
  { url = "*", is = "sticky", fg = "#CACCCC" }, # tx
  { url = "*", is = "dummy", fg = "#798186" }, # tx-3

  # Fallback
  { url = "*/", fg = "#CACCCC" }, # tx
  { url = "*", is = "exec", fg = "#798186" }, # gr
  { url = "*", fg = "#9FA5A9" } # tx-2
]

[icon]
dirs = [
  { name = ".config", text = "", fg = "#798186" }, # cy
  { name = ".git", text = "", fg = "#798186" }, # cy
  { name = ".github", text = "", fg = "#798186" }, # cy
  { name = ".npm", text = "", fg = "#798186" }, # cy
  { name = "Desktop", text = "", fg = "#798186" }, # cy
  { name = "Development", text = "", fg = "#798186" }, # cy
  { name = "Documents", text = "", fg = "#798186" }, # cy
  { name = "Downloads", text = "", fg = "#798186" }, # cy
  { name = "Library", text = "", fg = "#798186" }, # cy
  { name = "Movies", text = "", fg = "#798186" }, # cy
  { name = "Music", text = "", fg = "#798186" }, # cy
  { name = "Pictures", text = "", fg = "#798186" }, # cy
  { name = "Public", text = "", fg = "#798186" }, # cy
  { name = "Videos", text = "", fg = "#798186" } # cy
]
conds = [
  # Special files
  { if = "orphan", text = "", fg = "#798186" }, # tx-3
  { if = "link", text = "", fg = "#798186" }, # cy
  { if = "block", text = "", fg = "#CACCCC" }, # tx
  { if = "char", text = "", fg = "#CACCCC" }, # tx
  { if = "fifo", text = "", fg = "#DE6145" }, # ma
  { if = "sock", text = "", fg = "#DE6145" }, # ma
  { if = "sticky", text = "", fg = "#CACCCC" }, # tx
  { if = "dummy", text = "", fg = "#798186" }, # tx-3

  # Fallback
  { if = "dir", text = "", fg = "#798186" }, # cy
  { if = "exec", text = "", fg = "#798186" }, # gr
  { if = "!dir", text = "", fg = "#9FA5A9" } # tx-2
]