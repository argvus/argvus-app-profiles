# Argvus palette
# ---
# bg         "#0F0F0F"
# bg-2       "#1D1D23"
# ui         "#1A1816"
# ui-2       "#3A332D"
# ui-3       "#404552"
# tx-3       "#A98C72"
# tx-2       "#CEA37F"
# tx         "#EADCCC"
# red-400     "#E25D6C" re
# orange-400  "#F4BB54" or
# yellow-400  "#CEA37F" ye
# yellow-600  "#F4BB54" ye-2
# green-400   "#E2BE8A" gr
# cyan-400    "#E2BE8A" cy
# cyan-600    "#172D3D" cy-2
# cyan-700    "#172D3D" cy-700
# cyan-900    "#101C28" cy-900
# blue-400    "#E2BE8A" bl
# purple-400  "#EACEA7" pu
# magenta-400 "#E25D6C" ma

[app]
overall = { bg = "#0F0F0F" } # bg

[mgr]
cwd = { fg = "#EADCCC", bold = true } # tx

# Find
find_keyword = { fg = "#E2BE8A", reversed = true } # cy
find_position = { fg = "#E2BE8A", bold = true, italic = true } # cy

# Marker
marker_copied = { fg = "#E2BE8A", bg = "#E2BE8A" } # gr, gr
marker_cut = { fg = "#E25D6C", bg = "#E25D6C" } # re, re
marker_marked = { fg = "#172D3D", bg = "#172D3D" } # cy-700, cy-700
marker_selected = { fg = "#E2BE8A", bg = "#E2BE8A" } # cy, cy

# Count
count_copied = { fg = "#E2BE8A", bold = true, reversed = true } # gr
count_cut = { fg = "#E25D6C", bold = true, reversed = true } # re
count_selected = { fg = "#E2BE8A", bold = true, reversed = true } # cy

# Border
border_symbol = "│"
border_style = { fg = "#1A1816" } # ui

[indicator]
parent = { underline = true }
current = { fg = "#EADCCC", bg = "#1A1816" } # tx, ui
preview = { underline = true }
padding = { open = "█", close = "█" }

[tabs]
active = { fg = "#EADCCC", bg = "#404552", bold = true } # tx, ui-3
inactive = { fg = "#CEA37F", bg = "#1A1816" } # tx-2, ui
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
# Normal mode
normal_main = { fg = "#EADCCC", bg = "#404552", bold = true } # tx, ui-3
normal_alt = { fg = "#CEA37F", bg = "#1A1816" } # tx-2, ui

# Select mode
select_main = { fg = "#0F0F0F", bg = "#E2BE8A", bold = true } # bg, cy
select_alt = { fg = "#E2BE8A", bg = "#101C28" } # cy, cy-900

# Unset mode
unset_main = { fg = "#0F0F0F", bg = "#E2BE8A", bold = true } # bg, cy
unset_alt = { fg = "#E2BE8A", bg = "#101C28" } # cy, cy-900

[status]
overall = { fg = "#EADCCC" } # tx

# Permissions
perm_type = { fg = "#E2BE8A" } # bl
perm_read = { fg = "#CEA37F" } # ye
perm_write = { fg = "#E25D6C" } # re
perm_exec = { fg = "#E2BE8A" } # gr
perm_sep = { fg = "#CEA37F" } # tx-2

# Progress
progress_label = { fg = "#0F0F0F" } # bg
progress_normal = { fg = "#E2BE8A", bg = "#172D3D" } # cy, cy-700
progress_error = { bg = "#E25D6C" } # re

[which]
cols = 3
mask = { bg = "#1D1D23" } # bg-2
cand = { fg = "#E2BE8A", bold = true } # cy
rest = { fg = "#E2BE8A", italic = true } # cy
desc = { fg = "#A98C72" } # tx-3
separator = " "
separator_style = { }

[confirm]
border = { fg = "#404552" } # ui-3
title = { fg = "#A98C72", bold = true } # tx-3
body = { fg = "#EADCCC", bold = true } # tx
list = { fg = "#EADCCC" } # tx
btn_yes = { fg = "#EADCCC", bg = "#404552", bold = true } # tx, ui-3
btn_no = { fg = "#CEA37F", bg = "#1A1816" } # tx-2, ui

[spot]
border = { fg = "#404552" } # ui-3
title = { fg = "#A98C72", bold = true } # tx-3
tbl_col = { fg = "#CEA37F" } # tx-2
tbl_cell = { fg = "#EADCCC", bg = "#1A1816" } # tx, ui

[notify]
# Notification title
title_info = { fg = "#E2BE8A" } # bl
title_warn = { fg = "#F4BB54" } # or
title_error = { fg = "#E25D6C" } # re

[pick]
border = { fg = "#404552", bold = true } # ui-3
active = { fg = "#EADCCC" } # tx
inactive = { fg = "#CEA37F" } # tx-2

[input]
border = { fg = "#404552" } # ui-3
title = { fg = "#A98C72", bold = true } # tx-3
value = { fg = "#EADCCC" } # tx
selected = { bg = "#1D1D23" } # bg-2

[cmp]
border = { fg = "#404552", bold = true } # ui-3
active = { fg = "#EADCCC", bg = "#1A1816" } # tx, ui
inactive = { fg = "#CEA37F" } # tx-2

[tasks]
border = { fg = "#404552" } # ui-3
title = { fg = "#A98C72", bold = true } # tx-3
hovered = { fg = "#EADCCC", bg = "#1A1816" } # tx, ui

[help]
on = { fg = "#E2BE8A" } # bl
run = { fg = "#E2BE8A" } # cy
desc = { fg = "#A98C72", italic = true } # tx-3
hovered = { bg = "#1A1816" } # ui
footer = { fg = "#0F0F0F", bg = "#E2BE8A", bold = true } # bg, cy

[filetype]
rules = [
  # Empty files
  { mime = "inode/empty", fg = "#A98C72" }, # tx-3

  # Special files
  { url = "*", is = "orphan", fg = "#A98C72" }, # tx-3
  { url = "*/", is = "orphan", fg = "#A98C72" }, # tx-3
  { url = "*", is = "link", fg = "#E2BE8A" }, # cy
  { url = "*/", is = "link", fg = "#E2BE8A" }, # cy
  { url = "*", is = "block", fg = "#EADCCC" }, # tx
  { url = "*", is = "char", fg = "#EADCCC" }, # tx
  { url = "*", is = "fifo", fg = "#E25D6C" }, # ma
  { url = "*", is = "sock", fg = "#E25D6C" }, # ma
  { url = "*", is = "sticky", fg = "#EADCCC" }, # tx
  { url = "*", is = "dummy", fg = "#A98C72" }, # tx-3

  # Fallback
  { url = "*/", fg = "#EADCCC" }, # tx
  { url = "*", is = "exec", fg = "#E2BE8A" }, # gr
  { url = "*", fg = "#CEA37F" } # tx-2
]

[icon]
dirs = [
  { name = ".config", text = "", fg = "#E2BE8A" }, # cy
  { name = ".git", text = "", fg = "#E2BE8A" }, # cy
  { name = ".github", text = "", fg = "#E2BE8A" }, # cy
  { name = ".npm", text = "", fg = "#E2BE8A" }, # cy
  { name = "Desktop", text = "", fg = "#E2BE8A" }, # cy
  { name = "Development", text = "", fg = "#E2BE8A" }, # cy
  { name = "Documents", text = "", fg = "#E2BE8A" }, # cy
  { name = "Downloads", text = "", fg = "#E2BE8A" }, # cy
  { name = "Library", text = "", fg = "#E2BE8A" }, # cy
  { name = "Movies", text = "", fg = "#E2BE8A" }, # cy
  { name = "Music", text = "", fg = "#E2BE8A" }, # cy
  { name = "Pictures", text = "", fg = "#E2BE8A" }, # cy
  { name = "Public", text = "", fg = "#E2BE8A" }, # cy
  { name = "Videos", text = "", fg = "#E2BE8A" } # cy
]
conds = [
  # Special files
  { if = "orphan", text = "", fg = "#A98C72" }, # tx-3
  { if = "link", text = "", fg = "#E2BE8A" }, # cy
  { if = "block", text = "", fg = "#EADCCC" }, # tx
  { if = "char", text = "", fg = "#EADCCC" }, # tx
  { if = "fifo", text = "", fg = "#E25D6C" }, # ma
  { if = "sock", text = "", fg = "#E25D6C" }, # ma
  { if = "sticky", text = "", fg = "#EADCCC" }, # tx
  { if = "dummy", text = "", fg = "#A98C72" }, # tx-3

  # Fallback
  { if = "dir", text = "", fg = "#E2BE8A" }, # cy
  { if = "exec", text = "", fg = "#E2BE8A" }, # gr
  { if = "!dir", text = "", fg = "#CEA37F" } # tx-2
]
